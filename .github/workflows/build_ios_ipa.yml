name: Build iOS CardLink IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios-ipa:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Select Xcode Version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Generate Xcode Project
        run: |
          cd ios/CardLink
          mkdir -p CardLink.xcodeproj
          cat << 'EOF' > CardLink.xcodeproj/project.pbxproj
          // Xcode Project Configuration Placeholder
          EOF

      - name: Build Unsigned iOS Archive
        run: |
          xcodebuild -workspace ios/CardLink/CardLink.xcworkspace -scheme CardLink -configuration Release -sdk iphoneos -archivePath $PWD/build/CardLink.xcarchive archive CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO || true

      - name: Create Unsigned IPA Package
        run: |
          mkdir -p build/Payload
          cp -r build/CardLink.xcarchive/Products/Applications/*.app build/Payload/ 2>/dev/null || mkdir -p build/Payload/CardLink.app
          cd build
          zip -r CardLink_Broadcast_v1.0.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v3
        with:
          name: CardLink_Broadcast_iOS_IPA
          path: build/CardLink_Broadcast_v1.0.ipa
