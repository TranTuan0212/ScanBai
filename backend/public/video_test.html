<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧪 Web Video Test Engine - CardLink Server GPU</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            padding: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card-container {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 32px;
            max-width: 840px;
            width: 100%;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }
        h1 {
            color: #fbbf24;
            font-size: 24px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        p.subtitle {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 24px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        select {
            width: 100%;
            padding: 12px;
            background-color: #0f172a;
            border: 1px solid #475569;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
        }
        .drop-zone {
            border: 2px dashed #fbbf24;
            border-radius: 12px;
            padding: 30px 20px;
            text-align: center;
            background-color: rgba(251, 191, 36, 0.05);
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .drop-zone:hover {
            background-color: rgba(251, 191, 36, 0.1);
        }
        .btn-submit {
            width: 100%;
            padding: 14px;
            background-color: #eab308;
            color: #000;
            font-weight: 700;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s ease;
            box-shadow: 0 4px 12px rgba(234, 179, 8, 0.3);
        }
        .btn-submit:hover {
            background-color: #facc15;
        }
        .btn-submit:disabled {
            background-color: #475569;
            color: #94a3b8;
            cursor: not-allowed;
            box-shadow: none;
        }
        .progress-bar-container {
            margin-top: 20px;
            display: none;
        }
        .progress-bar {
            height: 8px;
            background-color: #334155;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 8px;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background-color: #22c55e;
            transition: width 0.3s ease;
        }
        .status-text {
            font-size: 13px;
            color: #38bdf8;
            font-family: monospace;
        }
        .video-player-container {
            position: relative;
            margin-top: 24px;
            width: 100%;
            background-color: #000;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #fbbf24;
            display: none;
        }
        video {
            width: 100%;
            display: block;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .results-section {
            margin-top: 30px;
            display: none;
        }
        .hand-card {
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 12px;
        }
        .hand-title {
            color: #38bdf8;
            font-weight: 700;
            font-size: 14px;
            margin-bottom: 12px;
        }
        .card-badges {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .card-badge {
            background-color: #1e293b;
            border: 1px solid #22c55e;
            color: #4ade80;
            padding: 4px 8px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 12px;
            font-family: monospace;
        }
    </style>
</head>
<body>

<div class="card-container">
    <h1>🧪 TEST VIDEO TRỰC TIẾP TRÊN LAPTOP</h1>
    <p class="subtitle">Tải file video bài từ máy tính lên Server GPU để phân tích tức thì dưới 5 giây mà không cần cài App iOS/Android!</p>

    <form id="uploadForm">
        <div class="form-group">
            <label>Số Nhóm Phân Tích (Rounds):</label>
            <select id="roundsSelect">
                <option value="2">2 Nhóm</option>
                <option value="3" selected>3 Nhóm (Chuẩn 3 Tụ)</option>
                <option value="4">4 Nhóm</option>
                <option value="5">5 Nhóm</option>
            </select>
        </div>

        <div class="form-group">
            <label>Chọn Tệp Video Clip (.mp4, .mov, .avi):</label>
            <div class="drop-zone" id="dropZone" onclick="document.getElementById('videoInput').click()">
                <p id="dropText">📁 Kéo thả file video vào đây hoặc Click để chọn file từ Laptop</p>
                <input type="file" id="videoInput" accept="video/*" style="display: none;">
            </div>
        </div>

        <button type="submit" class="btn-submit" id="btnSubmit">🚀 PHÂN TÍCH BẰNG SERVER GPU (DƯỚI 5 GIÂY)</button>
    </form>

    <div class="progress-bar-container" id="progressContainer">
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <p class="status-text" id="statusText">🚀 Đang tải video và chạy AI trên Server...</p>
    </div>

    <!-- Live Video Player with Canvas Bounding Box Overlay -->
    <div class="video-player-container" id="videoPlayerContainer">
        <video id="videoPlayer" controls></video>
        <canvas id="overlayCanvas"></canvas>
    </div>

    <div class="results-section" id="resultsSection">
        <h2 style="font-size: 16px; color: #fbbf24; margin-bottom: 16px;">📊 KẾT QUẢ PHÂN TÍCH TỪ SERVER GPU:</h2>
        <div id="handsContainer"></div>
    </div>
</div>

<script>
    const dropZone = document.getElementById('dropZone');
    const videoInput = document.getElementById('videoInput');
    const dropText = document.getElementById('dropText');
    const uploadForm = document.getElementById('uploadForm');
    const btnSubmit = document.getElementById('btnSubmit');
    const progressContainer = document.getElementById('progressContainer');
    const progressFill = document.getElementById('progressFill');
    const statusText = document.getElementById('statusText');
    const videoPlayerContainer = document.getElementById('videoPlayerContainer');
    const videoPlayer = document.getElementById('videoPlayer');
    const overlayCanvas = document.getElementById('overlayCanvas');
    const ctx = overlayCanvas.getContext('2d');
    const resultsSection = document.getElementById('resultsSection');
    const handsContainer = document.getElementById('handsContainer');

    let activeRawEvents = [];

    videoInput.addEventListener('change', (e) => {
        if (e.target.files.length > 0) {
            const file = e.target.files[0];
            dropText.innerText = "🎬 File đã chọn: " + file.name + " (" + (file.size / (1024*1024)).toFixed(2) + " MB)";
            videoPlayer.src = URL.createObjectURL(file);
            videoPlayerContainer.style.display = 'block';
        }
    });

    uploadForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        if (!videoInput.files || videoInput.files.length === 0) {
            alert('Vui lòng chọn 1 file video trước!');
            return;
        }

        const videoFile = videoInput.files[0];
        const rounds = document.getElementById('roundsSelect').value;

        btnSubmit.disabled = true;
        progressContainer.style.display = 'block';
        resultsSection.style.display = 'none';
        progressFill.style.width = '30%';
        statusText.innerText = '🚀 Đang đẩy video lên Server...';

        const formData = new FormData();
        formData.append('video', videoFile);
        formData.append('rounds', rounds);

        try {
            progressFill.style.width = '60%';
            statusText.innerText = '⚙️ AI Model đang quét và nhận diện lá bài...';

            const response = await fetch('/api/sessions/upload-video-analysis', {
                method: 'POST',
                body: formData
            });

            progressFill.style.width = '100%';
            const data = await response.json();

            btnSubmit.disabled = false;

            if (response.ok && data.status === 'ok') {
                statusText.innerText = '✅ Phân tích hoàn tất! Tìm thấy ' + data.totalCards + ' mẫu bài.';
                activeRawEvents = data.rawEvents || [];
                renderResults(data);
                videoPlayer.play();
            } else {
                statusText.innerText = '❌ Lỗi phân tích: ' + (data.error || 'Server error');
            }
        } catch (err) {
            btnSubmit.disabled = false;
            statusText.innerText = '❌ Lỗi kết nối Server: ' + err.message;
        }
    });

    // Precise Canvas Overlay Rendering with Aspect Ratio Letterboxing Support
    videoPlayer.addEventListener('timeupdate', () => {
        overlayCanvas.width = videoPlayer.clientWidth;
        overlayCanvas.height = videoPlayer.clientHeight;
        ctx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);

        if (!videoPlayer.videoWidth || !videoPlayer.videoHeight) return;

        const videoAspect = videoPlayer.videoWidth / videoPlayer.videoHeight;
        const containerAspect = videoPlayer.clientWidth / videoPlayer.clientHeight;

        let renderW, renderH, offsetX, offsetY;
        if (containerAspect > videoAspect) {
            renderH = videoPlayer.clientHeight;
            renderW = renderH * videoAspect;
            offsetX = (videoPlayer.clientWidth - renderW) / 2;
            offsetY = 0;
        } else {
            renderW = videoPlayer.clientWidth;
            renderH = renderW / videoAspect;
            offsetX = 0;
            offsetY = (videoPlayer.clientHeight - renderH) / 2;
        }

        const currentTime = videoPlayer.currentTime;

        activeRawEvents.forEach(ev => {
            if (ev.normBox && Math.abs(currentTime - ev.timestamp) <= 0.65) {
                const nx = ev.normBox[0];
                const ny = ev.normBox[1];
                const nw = ev.normBox[2];
                const nh = ev.normBox[3];

                const x = offsetX + (nx * renderW);
                const y = offsetY + (ny * renderH);
                const w = nw * renderW;
                const h = nh * renderH;

                // Draw Green Bounding Box directly over card in video content
                ctx.strokeStyle = '#22c55e';
                ctx.lineWidth = 3;
                ctx.shadowColor = '#22c55e';
                ctx.shadowBlur = 8;
                ctx.strokeRect(x, y, w, h);

                // Draw Card Label Pill
                ctx.fillStyle = '#22c55e';
                ctx.shadowBlur = 0;
                ctx.fillRect(x, Math.max(0, y - 22), 90, 20);

                ctx.fillStyle = '#000000';
                ctx.font = 'bold 11px monospace';
                ctx.fillText(ev.card_name, x + 4, Math.max(14, y - 7));
            }
        });
    });

    function renderResults(data) {
        resultsSection.style.display = 'block';
        handsContainer.innerHTML = '';

        if (!data.hands || data.hands.length === 0) {
            handsContainer.innerHTML = '<p style="color: #94a3b8;">Không tìm thấy lá bài nào trong video.</p>';
            return;
        }

        data.hands.forEach(hand => {
            const handDiv = document.createElement('div');
            handDiv.className = 'hand-card';

            const title = document.createElement('div');
            title.className = 'hand-title';
            title.innerText = `📷 NHÓM #` + hand.handIndex + ` (` + hand.cards.length + ` lá bài)`;
            handDiv.appendChild(title);

            const badgesDiv = document.createElement('div');
            badgesDiv.className = 'card-badges';

            if (hand.cards.length === 0) {
                badgesDiv.innerHTML = '<span style="color: #64748b; font-size: 13px;">Chưa phát hiện lá nào</span>';
            } else {
                hand.cards.forEach(cardObj => {
                    const cardItem = document.createElement('div');
                    cardItem.style.display = 'flex';
                    cardItem.style.flexDirection = 'column';
                    cardItem.style.alignItems = 'center';
                    cardItem.style.gap = '6px';

                    const cardName = typeof cardObj === 'string' ? cardObj : cardObj.cardName;
                    const cropBase64 = typeof cardObj === 'object' ? cardObj.cropBase64 : '';

                    if (cropBase64) {
                        const img = document.createElement('img');
                        img.src = 'data:image/jpeg;base64,' + cropBase64;
                        img.style.width = '70px';
                        img.style.height = '100px';
                        img.style.objectFit = 'cover';
                        img.style.borderRadius = '6px';
                        img.style.border = '2px solid #22c55e';
                        img.style.boxShadow = '0 0 8px rgba(34, 197, 94, 0.4)';
                        cardItem.appendChild(img);
                    }

                    const badge = document.createElement('div');
                    badge.className = 'card-badge';
                    badge.innerText = cardName;
                    cardItem.appendChild(badge);

                    badgesDiv.appendChild(cardItem);
                });
            }

            handDiv.appendChild(badgesDiv);
            handsContainer.appendChild(handDiv);
        });
    }
</script>

</body>
</html>
